<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>NIKKE 充能点位标注</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0b1210;overflow:hidden;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  #c{display:block}
  #panel{position:fixed;left:16px;top:14px;color:#d8e9df;font-size:12.5px;line-height:1.65;
    background:rgba(10,20,16,.82);border:1px solid #24463a;border-radius:10px;padding:12px 14px;
    backdrop-filter:blur(8px);max-width:330px}
  #panel h1{font-size:14px;font-weight:600;color:#eafaf1;margin-bottom:6px;letter-spacing:.4px}
  #panel .sub{color:#7fa392;font-size:11px;margin-bottom:9px}
  #panel table{width:100%;border-collapse:collapse;font-size:11.5px}
  #panel th{color:#7fa392;font-weight:500;text-align:left;padding:3px 4px;border-bottom:1px solid #1e3a30}
  #panel td{padding:4px 4px;border-bottom:1px solid #16261f}
  #panel .nv{color:#ffcf6b;font-weight:700;font-size:13px}
  #panel .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  #panel .foot{margin-top:9px;color:#6b8a7c;font-size:10.5px;line-height:1.55}
  #panel .hide{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>H36-35 充能点位<span id="slotTag"></span></h1>
  <div class="sub" id="subInfo">—</div>
  <table id="tbl">
    <thead><tr><th>#</th><th>命中</th><th>能量</th><th>充满</th></tr></thead>
    <tbody></tbody>
  </table>
  <div class="foot" id="foot">
    FOV 60° · 阵位由 cover_1~5 的 camera_position 决定<br>
    能量口径：2.80%/发 × 10000 = 280；穿透 N 段 = N×280
  </div>
</div>

<script type="importmap">
{"imports":{"three":"./libs/three.module.js","three/addons/":"./libs/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const Q = new URLSearchParams(location.search);
const ARENA = Q.get('arena') || '001';
const SLOT = +(Q.get('slot') || 3);
const TOPN = +(Q.get('top') || 5);
const W = +(Q.get('w') || 1600), H = +(Q.get('h') || 900);
const FOV = 60, NEAR = 0.1, FAR = 300;
const PITCH = +(Q.get("pitch") || 4.0);      // 相机俯仰（表现参数）
const BACK = +(Q.get('back') || 0);          // 相机额外后退（表现参数）

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0.4627, 0.4627, 0.4627).convertSRGBToLinear();
const cam = new THREE.PerspectiveCamera(FOV, W/H, NEAR, FAR);

// Unity(x,y,z) -> three(x,y,-z)
const U2T = (x, y, z) => new THREE.Vector3(x, y, -z);

function loadTex(path) {
  return new Promise(res => {
    new THREE.TextureLoader().load(path, t => {
      t.colorSpace = THREE.SRGBColorSpace;
      t.wrapS = t.wrapT = THREE.RepeatWrapping;
      res(t);
    }, undefined, () => res(null));
  });
}

const [charge, slots] = await Promise.all([
  fetch(`../导出/charge_${ARENA}.json`).then(r => r.json()),
  fetch('../导出/slots.json').then(r => r.json())
]);

const key = 'cover_' + SLOT;
const slotData = charge.slots[key];
const slotGeo = slots[ARENA][key];

// ---- 天空 ----
const tdir = ARENA === '001' ? '../素材/tex/' : `../素材/tex_${ARENA}/`;
const sky = await loadTex(tdir + 'sbg_swamplandjungle_skybox_side.png');
if (sky) {
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(285, 40, 24),
    new THREE.MeshBasicMaterial({ map: sky, side: THREE.BackSide, depthWrite: false })));
}

// ---- 相机：该阵位配置的 camera_position ----
const cU = slotGeo.cam;                                    // Unity 世界坐标
const camPos = U2T(cU[0], cU[1] + (+Q.get('cy') || 0), cU[2]);
camPos.z += BACK;                                          // 后退
const pr = THREE.MathUtils.degToRad(PITCH);
const camTgt = camPos.clone().add(new THREE.Vector3(0, Math.sin(pr) * 60, -Math.cos(pr) * 60));
cam.position.copy(camPos);
cam.lookAt(camTgt);

// ---- 场景 ----
const loader = new GLTFLoader();
const root = await new Promise((res, rej) =>
  loader.load(`../导出/arena_${ARENA}.glb`, g => res(g.scene), undefined, rej));
const bright = +(Q.get("bright") || 1.15);
root.traverse(o => {
  if (o.isMesh && o.material) {
    o.material.side = THREE.DoubleSide;
    o.material.fog = false;
    if (o.material.map) o.material.map.anisotropy = 4;
    if (o.material.color) o.material.color.setScalar(bright);
  }
});
scene.add(root);

// ---- 阵位标记 ----
const pU = slotData.char;
const pPos = U2T(pU[0], pU[1], pU[2]);
{
  const g = new THREE.RingGeometry(0.55, 0.78, 32);
  g.rotateX(-Math.PI / 2);
  const m = new THREE.MeshBasicMaterial({ color: 0x59f0c0, transparent: true, opacity: 0.9,
    side: THREE.DoubleSide, depthTest: false });
  const ring = new THREE.Mesh(g, m);
  ring.position.copy(pPos).add(new THREE.Vector3(0, 0.05, 0));
  ring.renderOrder = 999;
  scene.add(ring);
}

// ---- 标签 ----
function makeLabel(text, color, sub) {
  const pad = 10, fs = 40, fs2 = 26;
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  ctx.font = `700 ${fs}px -apple-system,"Microsoft YaHei",sans-serif`;
  const w1 = ctx.measureText(text).width;
  ctx.font = `500 ${fs2}px -apple-system,"Microsoft YaHei",sans-serif`;
  const w2 = sub ? ctx.measureText(sub).width : 0;
  c.width = Math.ceil(Math.max(w1, w2) + pad * 2 + 34);
  c.height = sub ? 118 : 76;
  const x = c.getContext('2d');
  x.fillStyle = 'rgba(6,16,12,.80)';
  x.strokeStyle = color;
  x.lineWidth = 3;
  const r = 12, W2 = c.width, H2 = c.height;
  x.beginPath();
  x.moveTo(r, 0); x.lineTo(W2 - r, 0); x.quadraticCurveTo(W2, 0, W2, r);
  x.lineTo(W2, H2 - r); x.quadraticCurveTo(W2, H2, W2 - r, H2);
  x.lineTo(r, H2); x.quadraticCurveTo(0, H2, 0, H2 - r);
  x.lineTo(0, r); x.quadraticCurveTo(0, 0, r, 0);
  x.closePath(); x.fill(); x.stroke();
  x.beginPath(); x.arc(28, 42, 12, 0, Math.PI * 2); x.fillStyle = color; x.fill();
  x.fillStyle = '#f2fff8';
  x.font = `700 ${fs}px -apple-system,"Microsoft YaHei",sans-serif`;
  x.fillText(text, 50, 56);
  if (sub) {
    x.fillStyle = '#a9c9ba';
    x.font = `500 ${fs2}px -apple-system,"Microsoft YaHei",sans-serif`;
    x.fillText(sub, 16, 98);
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true,
    depthTest: false, depthWrite: false }));
  const s = 0.016;
  sp.scale.set(c.width * s, c.height * s, 1);
  sp.renderOrder = 1000;
  return sp;
}

// ---- 射线 ----
const COLORS = [0xff5a4d, 0xff8a3d, 0xffc53d, 0x5ad1ff, 0x9b8cff];
const top = (slotData.top || []).slice(0, TOPN);
const tbody = document.querySelector('#tbl tbody');
tbody.innerHTML = '';

top.forEach((t, i) => {
  const col = COLORS[i % COLORS.length];
  const colHex = '#' + col.toString(16).padStart(6, '0');
  const yr = THREE.MathUtils.degToRad(t.yaw);
  const pt = THREE.MathUtils.degToRad(t.pitch);
  // Unity 方向 (sinYaw*cosP, sinP, cosYaw*cosP) -> three (x, y, -z)
  const dir = new THREE.Vector3(
    Math.sin(yr) * Math.cos(pt), Math.sin(pt), -Math.cos(yr) * Math.cos(pt)).normalize();
  const len = Math.min(t.last + 4, 260);

  const o = pPos.clone().add(new THREE.Vector3(0, 1.45, 0));
  const a = o.clone();
  const b = o.clone().add(dir.clone().multiplyScalar(len));
  const geo = new THREE.BufferGeometry().setFromPoints([a, b]);
  const line = new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: col, transparent: true, opacity: 0.95, depthTest: false, linewidth: 2 }));
  line.renderOrder = 998;
  scene.add(line);

  // 管状发光（细）
  const curve = new THREE.LineCurve3(a, b);
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 24, 0.055, 6, false),
    new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.55,
      depthTest: false }));
  tube.renderOrder = 997;
  scene.add(tube);

  // 起点球
  const dot = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 8),
    new THREE.MeshBasicMaterial({ color: col, depthTest: false }));
  dot.position.copy(a); dot.renderOrder = 999;
  scene.add(dot);

  // 标签：沿射线错开距离，并按列左右分离，避免堆叠
  const frac = 0.34 + (i % 3) * 0.16;
  const lp = o.clone().add(dir.clone().multiplyScalar(len * frac));
  const col_off = [-5.5, 6.5, -1.5, 8.0, 2.5][i % 5];
  const lb = makeLabel(`#${i + 1}  ${t.pct.toFixed(1)}%`, colHex,
    `${t.n} 段 · ${t.shots} 发 · ${t.first.toFixed(0)}m 起`);
  lb.position.copy(lp).add(new THREE.Vector3(col_off, 1.6 + (i % 4) * 2.6, 0));
  scene.add(lb);

  // 标签到射线的引线
  const lg = new THREE.BufferGeometry().setFromPoints([lp, lb.position.clone()]);
  scene.add(new THREE.Line(lg, new THREE.LineBasicMaterial({
    color: col, transparent: true, opacity: 0.55, depthTest: false })));

  tbody.insertAdjacentHTML('beforeend',
    `<tr><td><span class="dot" style="background:${colHex}"></span>#${i + 1}</td>` +
    `<td class="nv">${t.n}</td><td>${t.pct.toFixed(1)}%</td><td>${t.shots} 发</td></tr>`);
});

document.getElementById('slotTag').textContent = ` 阵位 ${SLOT}`;
document.getElementById('subInfo').textContent =
  `角色 (${pU[0].toFixed(1)}, ${pU[2].toFixed(1)}) · 相机 (${cU[0].toFixed(1)}, ${cU[2].toFixed(1)}) · FOV 60°`;

// ---- 渲染 ----
renderer.render(scene, cam);
window.__ready = true;
window.__shot = () => renderer.domElement.toDataURL('image/png');
if (Q.get('hud') === '0') document.getElementById('panel').style.display = 'none';
</script>
</body>
</html>
