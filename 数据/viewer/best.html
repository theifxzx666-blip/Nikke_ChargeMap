<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>NIKKE 最佳充能点</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0a1110;overflow:hidden;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  #c{display:block}
  #panel{position:fixed;left:16px;top:14px;color:#d8e9df;font-size:12.5px;line-height:1.6;
    background:rgba(9,18,15,.86);border:1px solid #24463a;border-radius:12px;padding:13px 15px;
    backdrop-filter:blur(9px);width:366px}
  #panel h1{font-size:14.5px;font-weight:600;color:#eafaf1;letter-spacing:.4px}
  #panel .sub{color:#7fa392;font-size:11px;margin:4px 0 10px}
  #big{display:flex;gap:14px;align-items:baseline;margin-bottom:9px}
  #big b{font-size:32px;color:#ffcf6b;line-height:1;font-weight:700}
  #big b i{font-size:15px;font-style:normal;color:#c8a95f;margin-left:2px}
  #big .r{font-size:11.5px;color:#9dbfae;line-height:1.5}
  #panel table{width:100%;border-collapse:collapse;font-size:11px}
  #panel th{color:#6f9484;font-weight:500;text-align:left;padding:3px 4px;border-bottom:1px solid #1e3a30}
  #panel td{padding:3px 4px;border-bottom:1px solid #14231d;color:#c3d8cd}
  #panel td.nm{max-width:196px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8fb3a3}
  #panel td.d{text-align:right;color:#ffcf6b}
  .tag{display:inline-block;padding:0 5px;border-radius:4px;font-size:9.5px;margin-right:3px}
  .soft{background:#1d4033;color:#8ce0b6}.medium{background:#3d3620;color:#e8c96a}
  .hard{background:#42231f;color:#ff9d8a}
  #panel .foot{margin-top:9px;color:#5f8272;font-size:10px;line-height:1.55}
  #hm{position:fixed;right:16px;top:14px;background:rgba(9,18,15,.86);border:1px solid #24463a;
    border-radius:10px;padding:8px;backdrop-filter:blur(9px)}
  #hm .cap{color:#7fa392;font-size:10px;margin-bottom:5px;display:flex;justify-content:space-between;gap:10px}
  #hm .wrap{position:relative;width:560px}
  #hm img{width:560px;display:block;border-radius:5px;image-rendering:pixelated}
  #cross{position:absolute;width:0;height:0;transform:translate(-50%,-50%)}
  #cross::before,#cross::after{content:"";position:absolute;background:#fff;box-shadow:0 0 4px #000}
  #cross::before{left:-11px;top:-1px;width:22px;height:2px}
  #cross::after{left:-1px;top:-11px;width:2px;height:22px}
  #cross em{position:absolute;left:13px;top:-19px;font-style:normal;font-size:10px;color:#fff;
    background:rgba(0,0,0,.7);padding:1px 5px;border-radius:3px;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>最佳充能点<span id="slotTag"></span></h1>
  <div class="sub" id="subInfo">—</div>
  <div id="big">
    <b id="nSeg">—<i>段</i></b>
    <div class="r" id="rInfo">—</div>
  </div>
  <table>
    <thead><tr><th>命中物</th><th style="text-align:right">距离</th></tr></thead>
    <tbody id="tb"></tbody>
  </table>
  <div class="foot" id="foot">
    FOV 60° · 阵位由 cover_1~5 的 camera_position 决定 · 命中数 = 一颗子弹穿透的不同可破坏物<br>
    能量口径：2.80%/发 × 10000 = 280；穿透 N 段 = N × 280
  </div>
</div>
<div id="hm">
  <div class="cap"><span id="hmCap">瞄准空间热力（横轴 yaw / 纵轴 pitch）</span></div>
  <div class="wrap"><img id="hmImg" alt=""><div id="cross"><em id="crLabel"></em></div></div>
</div>

<script type="importmap">
{"imports":{"three":"./libs/three.module.js","three/addons/":"./libs/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const Q = new URLSearchParams(location.search);
const ARENA = Q.get('arena') || '001';
const SLOT = +(Q.get('slot') || 5);
const MODE = Q.get('mode') || 'peak';          // peak | rec
const W = +(Q.get('w') || 1600), H = +(Q.get('h') || 900);
const FOV = 60, NEAR = 0.1, FAR = 300;
const PITCH = +(Q.get('pitch') || 4.0);
const BACK = +(Q.get('back') || 0);
const CY = +(Q.get('cy') || 0);

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0.4627, 0.4627, 0.4627).convertSRGBToLinear();
const cam = new THREE.PerspectiveCamera(FOV, W/H, NEAR, FAR);
const U2T = (x, y, z) => new THREE.Vector3(x, y, -z);

function loadTex(path) {
  return new Promise(res => {
    new THREE.TextureLoader().load(path, t => {
      t.colorSpace = THREE.SRGBColorSpace; t.wrapS = t.wrapT = THREE.RepeatWrapping; res(t);
    }, undefined, () => res(null));
  });
}

const [best, slots] = await Promise.all([
  fetch(`../导出/best_${ARENA}.json`).then(r => r.json()),
  fetch('../导出/slots.json').then(r => r.json())
]);

const key = 'cover_' + SLOT;
const sd = best.slots[key];
const sg = slots[ARENA][key];
const T = (MODE === 'rec' && sd.rec) ? sd.rec : sd.best;

// ---- 天空 ----
const tdir = ARENA === '001' ? '../素材/tex/' : `../素材/tex_${ARENA}/`;
const sky = await loadTex(tdir + 'sbg_swamplandjungle_skybox_side.png');
if (sky && Q.get('nosky') !== '1') {
  scene.add(new THREE.Mesh(new THREE.SphereGeometry(285, 40, 24),
    new THREE.MeshBasicMaterial({ map: sky, side: THREE.BackSide, depthWrite: false })));
}

// ---- 相机：默认取该阵位的 camera_position；orbit=1 时改为战术斜视角 ----
const cU = sg.cam;
const ORBIT = Q.get('orbit') === '1';
let camPos;
if (ORBIT) {
  // 先算射线，再据射线摆一个能看清纵深的机位
  const _yr = THREE.MathUtils.degToRad(T.yaw), _pt = THREE.MathUtils.degToRad(T.pitch);
  const _d = new THREE.Vector3(Math.sin(_yr) * Math.cos(_pt), Math.sin(_pt),
    -Math.cos(_yr) * Math.cos(_pt)).normalize();
  const _o = U2T(sd.origin[0], sd.origin[1], sd.origin[2]);
  const _len = Math.min((T.last || 60) + 6, 240);
  const mid = _o.clone().add(_d.clone().multiplyScalar(_len * 0.42));
  const side = new THREE.Vector3(_d.z, 0, -_d.x).normalize();
  const OS = +(Q.get('os') || 17), OH = +(Q.get('oh') || 7.5), OB = +(Q.get('ob') || -7);
  camPos = mid.clone().add(side.multiplyScalar(OS))
    .add(new THREE.Vector3(0, OH, 0))
    .add(_d.clone().multiplyScalar(OB));
  cam.position.copy(camPos);
  cam.lookAt(mid.clone().add(new THREE.Vector3(0, 1.5, 0)));
} else {
  camPos = U2T(cU[0], cU[1] + CY, cU[2]);
  camPos.z += BACK;
  const pr = THREE.MathUtils.degToRad(PITCH);
  cam.position.copy(camPos);
  cam.lookAt(camPos.clone().add(new THREE.Vector3(0, Math.sin(pr) * 60, -Math.cos(pr) * 60)));
}

// ---- 场景 ----
const loader = new GLTFLoader();
const root = await new Promise((res, rej) =>
  loader.load(`../导出/arena_${ARENA}.glb`, g => res(g.scene), undefined, rej));
const bright = +(Q.get("bright") || 1.15);
root.traverse(o => {
  if (o.isMesh && o.material) {
    o.material.side = THREE.DoubleSide;
    o.material.fog = false;
    if (o.material.map) o.material.map.anisotropy = 4;
    if (o.material.color) o.material.color.setScalar(bright);
  }
});
scene.add(root);

// ---- 角色站位 ----
const pU = sd.char;
const pPos = U2T(pU[0], pU[1], pU[2]);
{
  const g = new THREE.RingGeometry(0.55, 0.78, 36); g.rotateX(-Math.PI / 2);
  const ring = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: 0x59f0c0, transparent: true,
    opacity: 0.95, side: THREE.DoubleSide, depthTest: false }));
  ring.position.copy(pPos).add(new THREE.Vector3(0, 0.05, 0)); ring.renderOrder = 999;
  scene.add(ring);
}

function makeLabel(html, color, sub, scale) {
  const pad = 12, fs = 44, fs2 = 26, s = scale || 0.015;
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  const f1 = `700 ${fs}px -apple-system,"Microsoft YaHei",sans-serif`;
  const f2 = `500 ${fs2}px -apple-system,"Microsoft YaHei",sans-serif`;
  ctx.font = f1; const w1 = ctx.measureText(html).width;
  ctx.font = f2; const w2 = sub ? ctx.measureText(sub).width : 0;
  c.width = Math.ceil(Math.max(w1, w2) + pad * 2 + 30);
  c.height = sub ? 124 : 80;
  const x = c.getContext('2d'), W2 = c.width, H2 = c.height, r = 13;
  x.fillStyle = 'rgba(6,15,12,.84)'; x.strokeStyle = color; x.lineWidth = 3;
  x.beginPath();
  x.moveTo(r, 0); x.lineTo(W2-r, 0); x.quadraticCurveTo(W2, 0, W2, r);
  x.lineTo(W2, H2-r); x.quadraticCurveTo(W2, H2, W2-r, H2);
  x.lineTo(r, H2); x.quadraticCurveTo(0, H2, 0, H2-r);
  x.lineTo(0, r); x.quadraticCurveTo(0, 0, r, 0); x.closePath(); x.fill(); x.stroke();
  x.beginPath(); x.arc(26, 44, 11, 0, Math.PI*2); x.fillStyle = color; x.fill();
  x.fillStyle = '#f2fff8'; x.font = f1; x.fillText(html, 46, 60);
  if (sub) { x.fillStyle = '#a9c9ba'; x.font = f2; x.fillText(sub, 16, 102); }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: t, transparent: true,
    depthTest: false, depthWrite: false }));
  sp.scale.set(c.width * s, c.height * s, 1); sp.renderOrder = 1000;
  return sp;
}

// ---- 射线 ----
const yr = THREE.MathUtils.degToRad(T.yaw), pt = THREE.MathUtils.degToRad(T.pitch);
const dir = new THREE.Vector3(Math.sin(yr) * Math.cos(pt), Math.sin(pt),
  -Math.cos(yr) * Math.cos(pt)).normalize();
const origin = U2T(sd.origin[0], sd.origin[1], sd.origin[2]);
const rayLen = Math.min((T.last || 60) + 6, 240);
const GOLD = 0xffcf6b;

// 主射线
{
  const b = origin.clone().add(dir.clone().multiplyScalar(rayLen));
  const curve = new THREE.LineCurve3(origin, b);
  scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 30, 0.075, 8, false),
    new THREE.MeshBasicMaterial({ color: GOLD, transparent: true, opacity: 0.75, depthTest: false }))
    .translateY(0));
  const ln = new THREE.Line(new THREE.BufferGeometry().setFromPoints([origin, b]),
    new THREE.LineBasicMaterial({ color: 0xfff2cc, transparent: true, opacity: 1, depthTest: false }));
  ln.renderOrder = 998; scene.add(ln);
}

// 命中点：按距离分簇，同簇竖排标注，避免堆叠
const clusterKey = d => Math.round(d / 4);
const groups = {};
T.detail.forEach((d, i) => { const k = clusterKey(d.d); (groups[k] = groups[k] || []).push({ ...d, i }); });
Object.values(groups).forEach(list => {
  list.forEach((d, n) => {
    const p = origin.clone().add(dir.clone().multiplyScalar(d.d));
    const col = d.grp === 'hard' ? 0xff9d8a : d.grp === 'medium' ? 0xe8c96a : 0x7fe3b4;
    const colHex = '#' + col.toString(16).padStart(6, '0');
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.34, 14, 10),
      new THREE.MeshBasicMaterial({ color: col, depthTest: false }));
    m.position.copy(p); m.renderOrder = 1001; scene.add(m);
    const halo = new THREE.Mesh(new THREE.RingGeometry(0.66, 0.94, 22),
      new THREE.MeshBasicMaterial({ color: col, transparent: true, opacity: 0.5,
        side: THREE.DoubleSide, depthTest: false }));
    halo.position.copy(p); halo.lookAt(cam.position); halo.renderOrder = 1000; scene.add(halo);
    // 竖排标签
    const lp = p.clone().add(new THREE.Vector3(0.9, 1.9 + n * 1.55, 0));
    scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([p, lp]),
      new THREE.LineBasicMaterial({ color: col, transparent: true, opacity: 0.6, depthTest: false })));
    const lb = makeLabel(String(d.i + 1), colHex, `${d.d.toFixed(0)}m`, 0.0105);
    lb.position.copy(lp).add(new THREE.Vector3(1.1, 0, 0));
    scene.add(lb);
  });
});

// 距离刻度：沿射线每 20m 一个刻度，标出深度
for (let L = 20; L <= Math.floor(rayLen / 20) * 20; L += 20) {
  const p = origin.clone().add(dir.clone().multiplyScalar(L));
  const t = 0.45;
  const a1 = p.clone().add(new THREE.Vector3(0, -t, 0));
  const a2 = p.clone().add(new THREE.Vector3(0, t, 0));
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a1, a2]),
    new THREE.LineBasicMaterial({ color: 0xfff2cc, transparent: true, opacity: 0.5,
      depthTest: false })));
  const lb = makeLabel(`${L}m`, '#8fb3a3', null, 0.0075);
  lb.material.opacity = 0.9;
  lb.position.copy(p).add(new THREE.Vector3(0, 1.15, 0));
  scene.add(lb);
}

// 主标签贴在射线中前段
{
  const lp = origin.clone().add(dir.clone().multiplyScalar(rayLen * 0.30));
  const lb = makeLabel(`${T.n} 段  ${T.pct.toFixed(1)}%`, '#ffcf6b',
    `充满 ${T.shots} 发 · ${T.first}~${T.last}m`, 0.030);
  lb.position.copy(lp).add(new THREE.Vector3(-1.2, 4.2, 0));
  scene.add(lb);
  scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([lp, lb.position.clone()]),
    new THREE.LineBasicMaterial({ color: GOLD, transparent: true, opacity: 0.5, depthTest: false })));
}

// ---- 面板 ----
document.getElementById('slotTag').textContent = ` · 战场 ${ARENA} · 阵位 ${SLOT}`;
document.getElementById('subInfo').textContent =
  `角色 (${pU[0].toFixed(1)}, ${pU[2].toFixed(1)}) · 相机 (${cU[0].toFixed(1)}, ${cU[2].toFixed(1)})` +
  ` · 瞄准 yaw ${T.yaw > 0 ? '+' : ''}${T.yaw.toFixed(2)}° / pitch +${T.pitch.toFixed(2)}°`;
document.getElementById('nSeg').innerHTML = `${T.n}<i>段</i>`;
document.getElementById('rInfo').innerHTML =
  `<b style="color:#ffcf6b">${T.pct.toFixed(1)}%</b> / 发<br>充满 ${T.shots} 发<br>` +
  `窗口 ${T.win_y.toFixed(2)}°×${T.win_p.toFixed(2)}°`;
const tb = document.getElementById('tb');
T.detail.forEach(d => {
  tb.insertAdjacentHTML('beforeend',
    `<tr><td class="nm"><span class="tag ${d.grp}">${d.grp[0].toUpperCase()}</span>` +
    `${d.name.replace(/^sbg_swamplandjungle_/, '')}</td>` +
    `<td class="d">${d.d.toFixed(1)}</td></tr>`);
});
if (MODE === 'rec') document.getElementById('foot').innerHTML =
  `当前显示「推荐点」：1° 窗口内不掉段的最优角度<br>` +
  `理论峰值 ${sd.n_max} 段（窗口 ${sd.best ? sd.best.win_y.toFixed(2) + '°×' + sd.best.win_p.toFixed(2) + '°' : '-'}）`;

// ---- 热力图裁切：只显示 yaw/pitch 的真实范围 ----
const yr0 = best.yaw_range[0], yr1 = best.yaw_range[1];
const pr0 = best.pitch_range[0], pr1 = best.pitch_range[1];
const hmImg = document.getElementById('hmImg');
hmImg.src = `../render/best_${ARENA}_${key}_heat.png`;
const cx = (T.yaw - yr0) / (yr1 - yr0) * 100;
const cyPct = (pr1 - T.pitch) / (pr1 - pr0) * 100;
const cross = document.getElementById('cross');
cross.style.left = cx + '%';
cross.style.top = cyPct + '%';
document.getElementById('crLabel').textContent =
  `yaw ${T.yaw > 0 ? '+' : ''}${T.yaw.toFixed(1)}° / pitch +${T.pitch.toFixed(1)}°`;

renderer.render(scene, cam);
window.__ready = true;
if (Q.get('hud') === '0') { document.getElementById('panel').style.display = 'none';
  document.getElementById('hm').style.display = 'none'; }
</script>
</body>
</html>
